server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # 앞단 프록시 뒤의 진짜 접속 IP (.env 의 TRUSTED_PROXIES, 시작할 때 real-ip.sh 가 만든다)
  include /etc/nginx/real-ip.conf;
  charset utf-8;
  charset_types text/plain text/css application/javascript;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain;

  # 청소년 회고 기록을 다루므로 기본 보안 헤더를 건다.
  # (location 안에서 add_header를 쓰면 이 헤더들이 빠지므로, 아래에서는 expires만 쓴다)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # 파일명에 해시가 붙은 정적 파일은 오래 캐시
  location /assets/ {
    expires 1y;
  }

  # index.html은 항상 새로 받아 새 버전이 바로 반영되게
  location = /index.html {
    expires -1;
  }

  # API는 같은 compose 안의 api 컨테이너로. resolver + 변수로 두면 api가 늦게 떠도 nginx가 먼저 죽지 않는다.
  location /api/ {
    resolver 127.0.0.11 valid=30s;
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m; # 회고를 가득 적은 큰 그래프 (서버도 2MB 에서 멈춘다)
  }

  # 관리자 웹 복원: DB 파일을 통째로 올리므로 이 주소만 크게 (서버도 200MB 에서 멈춘다)
  location = /api/admin/restore {
    resolver 127.0.0.11 valid=30s;
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 200m;
    proxy_read_timeout 300s;
  }

  # SPA 라우팅: /graph/... 같은 경로도 index.html로
  location / {
    try_files $uri /index.html;
  }
}
